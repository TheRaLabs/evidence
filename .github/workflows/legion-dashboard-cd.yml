name: Legion Dashboard Site CD

on:
  push:
    branches: ["main"]
    paths:
      - "sites/legion-dashboard-site/**"
      - ".github/workflows/legion-dashboard-cd.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: legion_evidence
  IMAGE_TAG: ci
  ECS_CLUSTER: legion-qa
  ECS_SERVICE: legion-qa-evidence-ec2
  AWS_REGION: us-east-1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./sites/legion-dashboard-site/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/theralabs/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger ECS rollout
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --desired-count 1
