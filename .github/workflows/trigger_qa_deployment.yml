name: Trigger QA Deployment (Evidence)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Legion Dashboard Site CD"
    types:
      - completed
    branches: ["main"]

permissions:
  contents: read
  deployments: write
  actions: write

env:
  ECS_CLUSTER: legion-qa
  ECS_SERVICE: legion-qa-evidence-ec2
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Skip unsuccessful workflow_run
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success'
        run: |
          echo "Upstream workflow did not succeed. Skip deploy."
          exit 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger Evidence deployment
        run: |
          aws ecs update-service \
            --cluster "${ECS_CLUSTER}" \
            --service "${ECS_SERVICE}" \
            --force-new-deployment \
            --desired-count 1
