name: QA Deployment Cron Check (Evidence)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  ECS_CLUSTER: legion-qa
  ECS_SERVICE: legion-qa-evidence-ec2
  AWS_REGION: us-east-1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check evidence ECS rollout state
        run: |
          dep=$(aws ecs describe-services --cluster "${ECS_CLUSTER}" --services "${ECS_SERVICE}" --output json)
          rollout_state=$(echo "$dep" | jq -r '.services[0].deployments[] | select(.status == "PRIMARY") | .rolloutState // "UNKNOWN"')
          echo "Primary rollout state: $rollout_state"
          if [ "$rollout_state" = "FAILED" ]; then
            echo "Evidence deployment failed."
            exit 1
          fi
